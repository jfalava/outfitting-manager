name: Outfitting Manager CLI - Release

on:
  push:
    tags: ["cli-v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - name: Tag matches the CLI version
        run: test "${GITHUB_REF_NAME#cli-v}" = "$(jq -r .version cli/package.json)"
      - run: bun run check

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: ubuntu-latest, target: nixos-x64 }
          - { os: ubuntu-24.04-arm, target: nixos-arm64 }
          - { os: macos-latest, target: darwin-arm64 }
          - { os: windows-latest, target: windows-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      # The script owns the Bun target and the per-platform entrypoint.
      - run: bun run --cwd cli build:${{ matrix.target }}

      # A stable identity keeps macOS Keychain "Always Allow" grants valid across releases;
      # ad-hoc signatures change with every build.
      - name: Sign macOS binary
        if: runner.os == 'macOS'
        working-directory: cli
        env:
          BINARY: dist/outfitting-manager-${{ matrix.target }}
          SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          KEYCHAIN="${RUNNER_TEMP}/signing.keychain-db"
          security create-keychain -p "" "${KEYCHAIN}"
          security set-keychain-settings "${KEYCHAIN}"
          security unlock-keychain -p "" "${KEYCHAIN}"
          echo "${SIGNING_P12}" | base64 --decode > "${RUNNER_TEMP}/signing.p12"
          security import "${RUNNER_TEMP}/signing.p12" -k "${KEYCHAIN}" -P "${SIGNING_P12_PASSWORD}" -T /usr/bin/codesign
          rm "${RUNNER_TEMP}/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "${KEYCHAIN}" >/dev/null
          security list-keychains -d user -s "${KEYCHAIN}" $(security list-keychains -d user | tr -d '"')
          # Self-signed and untrusted, so select the identity by certificate SHA-1, not by name.
          codesign --force --sign AE7EE5A6786769DF8E9EDB6B78872A3C95B7B8AA --identifier dev.outfitting.manager \
            --keychain "${KEYCHAIN}" "${BINARY}"
          codesign --verify --verbose=2 "${BINARY}"
          codesign --display --requirements - "${BINARY}"
          security delete-keychain "${KEYCHAIN}"

      # The archive holds the binary under its installed name, which
      # `outfitting-manager upgrade` and the installers look for.
      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [[ "${{ matrix.target }}" == windows-* ]]; then ext=".exe"; fi
          ARCHIVE="outfitting-manager-${{ matrix.target }}.zip"
          mkdir -p cli/dist/release
          cp "cli/dist/outfitting-manager-${{ matrix.target }}${ext}" "cli/dist/release/outfitting-manager${ext}"
          cd cli/dist/release
          chmod 755 "outfitting-manager${ext}"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            pwsh -NoProfile -Command "Compress-Archive -LiteralPath 'outfitting-manager${ext}' -DestinationPath '${ARCHIVE}' -Force"
          else
            zip -j "${ARCHIVE}" "outfitting-manager${ext}"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: outfitting-manager-${{ matrix.target }}
          retention-days: 1
          path: |
            cli/dist/release/outfitting-manager-${{ matrix.target }}.zip
            cli/dist/release/outfitting-manager-${{ matrix.target }}.zip.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: outfitting-manager-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
